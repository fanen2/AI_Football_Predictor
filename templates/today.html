<!DOCTYPE html>
<html>

<head>

<title>Today's Matches</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="header">

<h1>⚽ Today's Matches</h1>

<p>AI Football Predictor by Fanen</p>

</div>

{% for match in matches %}

<div class="match-card">

<h2>{{ match.home }} 🆚 {{ match.away }}</h2>

<div class="match-card">

    <h2>{{ match.home }} 🆚 {{ match.away }}</h2>

    <a href="/predict/{{ match.id }}">
        <button class="predict-btn">
            Predict Match
        </button>
    </a>

</div>
</div>

{% endfor %}

<div class="menu">

<a href="/">

<button>⬅ Back Home</button>

</a>

</div>

</body>

</html>
